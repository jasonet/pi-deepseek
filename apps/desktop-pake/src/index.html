<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Taosi Pake</title></head><body><div id="root">Starting Taosi Pake…</div><pre id="startup-error" role="alert" hidden></pre><script>function showStartupError(message){var target=document.getElementById('startup-error');target.hidden=false;target.textContent='Taosi error: '+message;}window.addEventListener('error',function(e){showStartupError(e.message);});window.addEventListener('unhandledrejection',function(e){showStartupError(String(e.reason));});</script><script type="module" src="./main.tsx"></script></body></html>
