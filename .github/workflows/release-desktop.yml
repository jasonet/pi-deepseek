name: Release Desktop (Pi-Deepseek)

# Fork-specific 3-platform release for jasonet/pi-deepseek.
# Manual dispatch avoids colliding with the inherited upstream `release.yml`
# (which is tag-triggered, mac+linux only, and syncs an upstream Homebrew tap).
#
# Usage: Actions tab -> "Release Desktop (Pi-Deepseek)" -> Run workflow ->
#   version: 2.6.6            (Electron, builds all 3 OSes)
#   platforms: windows-linux  (or all / one platform)
#   tauri_version: 2.6.6      (leave blank to skip the macOS Tauri build)
#
# electron-builder reads packaging metadata from apps/desktop/electron-builder.yml.
# Installers and updater metadata are verified before `gh release upload` publishes
# them to jasonet/pi-deepseek.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Electron version, no leading v (e.g. 2.6.6)"
        required: true
      platforms:
        description: "Electron platforms to release"
        required: true
        type: choice
        options:
          - all
          - windows-linux
          - macos
          - windows
          - linux
        default: all
      tauri_version:
        description: "Tauri version, no leading v (e.g. 2.6.6). Leave blank to skip."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          case "$PLATFORMS" in
            all)
              value='{"include":[{"platform":"macos","os":"macos-latest","args":"--mac"},{"platform":"windows","os":"windows-latest","args":"--win"},{"platform":"linux","os":"ubuntu-latest","args":"--linux"}]}'
              ;;
            windows-linux)
              value='{"include":[{"platform":"windows","os":"windows-latest","args":"--win"},{"platform":"linux","os":"ubuntu-latest","args":"--linux"}]}'
              ;;
            macos)
              value='{"include":[{"platform":"macos","os":"macos-latest","args":"--mac"}]}'
              ;;
            windows)
              value='{"include":[{"platform":"windows","os":"windows-latest","args":"--win"}]}'
              ;;
            linux)
              value='{"include":[{"platform":"linux","os":"ubuntu-latest","args":"--linux"}]}'
              ;;
            *)
              echo "Unsupported platforms selection: $PLATFORMS" >&2
              exit 1
              ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

  release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure target releases exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          TAURI_VERSION: ${{ inputs.tauri_version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ensure_release() {
            local version="$1"
            if ! gh release view "v${version}" --repo "$REPOSITORY" >/dev/null 2>&1; then
              gh release create "v${version}" --repo "$REPOSITORY" \
                --target "$TARGET_SHA" --draft --title "Pi-Deepseek v${version}" \
                --generate-notes
            fi
          }

          ensure_release "$VERSION"
          if [[ -n "$TAURI_VERSION" && "$TAURI_VERSION" != "$VERSION" ]]; then
            ensure_release "$TAURI_VERSION"
          fi

  electron:
    name: Electron (${{ matrix.os }})
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --filter @pi-gui/desktop run build

      - name: Package
        shell: bash
        run: |
          cd apps/desktop
          pnpm exec electron-builder ${{ matrix.args }} \
            --publish never \
            "-c.publish.releaseType=release" \
            "-c.extraMetadata.version=${{ inputs.version }}" \
            "-c.buildVersion=${{ inputs.version }}"

      - name: Verify packaged runtime dependencies
        if: ${{ matrix.platform != 'macos' }}
        working-directory: apps/desktop
        env:
          PI_APP_PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: pnpm run verify:packaged-runtime-deps

      - name: Verify Windows differential update assets
        if: ${{ matrix.platform == 'windows' }}
        working-directory: apps/desktop
        env:
          PI_APP_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm run verify:windows-update-assets

      - name: Verify macOS app signatures
        if: ${{ matrix.platform == 'macos' }}
        working-directory: apps/desktop
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac/Pi-Deepseek.app
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Pi-Deepseek.app

      - name: First-run smoke (Windows)
        if: ${{ matrix.platform == 'windows' }}
        working-directory: apps/desktop
        run: pnpm run verify:first-run:packaged

      - name: First-run smoke (Linux)
        if: ${{ matrix.platform == 'linux' }}
        working-directory: apps/desktop
        run: xvfb-run --auto-servernum pnpm run verify:first-run:packaged

      - name: Verify release contains no credentials
        working-directory: apps/desktop
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run verify:release-no-secrets

      - name: Upload Windows release assets
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            apps/desktop/release/Pi-Deepseek-${{ inputs.version }}-win-* \
            apps/desktop/release/latest.yml \
            --repo "${{ github.repository }}" --clobber

      - name: Upload Linux release assets
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            apps/desktop/release/Pi-Deepseek-${{ inputs.version }}-linux-* \
            apps/desktop/release/latest-linux*.yml \
            --repo "${{ github.repository }}" --clobber

      - name: Upload macOS release assets
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            apps/desktop/release/Pi-Deepseek-${{ inputs.version }}-mac-* \
            apps/desktop/release/latest-mac.yml \
            --repo "${{ github.repository }}" --clobber

  publish:
    name: Publish Electron release
    needs: electron
    runs-on: ubuntu-latest
    steps:
      - name: Publish release and mark latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest

  tauri:
    name: Tauri (macOS)
    if: ${{ inputs.tauri_version != '' }}
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build self-contained signed DMG (bundles node + sidecar)
        working-directory: apps/desktop-tauri
        run: pnpm run package:mac

      - name: Upload Tauri dmg to v${{ inputs.tauri_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls apps/desktop-tauri/src-tauri/target/release/bundle/dmg/Pi-Deepseek-*-tauri-mac-*.dmg | head -1)
          gh release upload "v${{ inputs.tauri_version }}" "$DMG" \
            --repo "${{ github.repository }}" --clobber
